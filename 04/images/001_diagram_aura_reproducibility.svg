     text-anchor="middle"
     class="serif caption"
     id="text33"
     style="display:none">The aura (unique presence in time and space) surrounds the original. Mechanical and then digital reproduction enable serial multiplicity, shifting authenticity from material uniqueness to certification and provenance.</text>
