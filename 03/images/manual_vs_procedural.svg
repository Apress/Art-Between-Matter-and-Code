<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1000" height="700" viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg" version="1.1">
  <rect x="0" y="0" width="1000" height="700" fill="#ffffff" />

  <!-- Title -->
  <text x="500.0" y="60" text-anchor="middle"
        font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#111111">Manual vs Procedural Modeling — Key Differences</text>

  <!-- Left card -->
  <g>
    <rect x="40" y="100" width="440" height="500" rx="22" ry="22"
          fill="#f7f7f9" stroke="#cfcfd6" stroke-width="1.5"/>
    <!-- Left header bar -->
    <rect x="40" y="100" width="440" height="48" rx="22" ry="22" fill="#3a7bd5" />
    <text x="60" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Manual Digital Modeling</text>
    <circle cx="66" cy="186" r="4" fill="#333333" />
<text x="80" y="180" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Direct manipulation of vertices/edges/faces</text>
<circle cx="66" cy="220" r="4" fill="#333333" />
<text x="80" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Gesture as discrete, intentional action</text>
<circle cx="66" cy="254" r="4" fill="#333333" />
<text x="80" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Granular, local control; labor‑intensive</text>
<circle cx="66" cy="288" r="4" fill="#333333" />
<text x="80" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Deterministic edits; limited variability</text>
<circle cx="66" cy="322" r="4" fill="#333333" />
<text x="80" y="316" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Form fixed unless reworked manually</text>
<circle cx="66" cy="356" r="4" fill="#333333" />
<text x="80" y="350" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Authorship centered on the hand and eye</text>
  </g>

  <!-- Right card -->
  <g>
    <rect x="520" y="100" width="440" height="500" rx="22" ry="22"
          fill="#f7f7f9" stroke="#cfcfd6" stroke-width="1.5"/>
    <!-- Right header bar -->
    <rect x="520" y="100" width="440" height="48" rx="22" ry="22" fill="#c24c8a" />
    <text x="540" y="132" font-family="Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Procedural Modeling</text>
    <circle cx="546" cy="186" r="4" fill="#333333" />
<text x="560" y="180" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Rules, parameters, and node networks</text>
<circle cx="546" cy="220" r="4" fill="#333333" />
<text x="560" y="214" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Gesture as system design (relations/constraints)</text>
<circle cx="546" cy="254" r="4" fill="#333333" />
<text x="560" y="248" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Global, non‑destructive changes; scalable</text>
<circle cx="546" cy="288" r="4" fill="#333333" />
<text x="560" y="282" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">High variability via randomness/data inputs</text>
<circle cx="546" cy="322" r="4" fill="#333333" />
<text x="560" y="316" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Forms evolve across versions & states</text>
<circle cx="546" cy="356" r="4" fill="#333333" />
<text x="560" y="350" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#333333">Authorship shared with algorithmic processes</text>
  </g>

  <!-- Footer note -->
  <text x="500.0" y="660" text-anchor="middle"
        font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#666666">
    Edit this SVG freely in Inkscape: fonts are standard system sans-serif; colors and text are easily modifiable.
  </text>
</svg>
