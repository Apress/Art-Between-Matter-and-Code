    <text x="90" y="662" style="font-size:16px;font-weight:bold;fill:#ffffff;font-family:DejaVu Sans, Arial;">Scene Time</text>
    <text x="92" y="692" style="font-size:14px;font-weight:normal;fill:#333333;font-family:DejaVu Sans, Arial;">Seconds →</text>
  </g>
  <g>
    <rect x="320" y="640" rx="12" ry="12" width="200" height="120" fill="#ffffff" stroke="#cdd6ff" stroke-width="2"/>
