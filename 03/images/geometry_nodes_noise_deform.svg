<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#f7f8ff"/>
  <text x="800" y="42" style="font-size:24px;font-weight:bold;fill:#1c2038;font-family:DejaVu Sans, Arial;" text-anchor="middle">Noise-based Deformation – Geometry Nodes Schematic</text>
  <text x="800" y="70" style="font-size:16px;font-weight:normal;fill:#3b3f55;font-family:DejaVu Sans, Arial;" text-anchor="middle">Position → Vector Math (Scale) → Noise Texture (4D) → Map Range → Combine XYZ → Set Position → Output</text>
