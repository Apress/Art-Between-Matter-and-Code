    <text x="80" y="815" style="font-size:14px;font-weight:normal;fill:#333;font-family:DejaVu Sans, Arial;">• Increase mesh resolution (Subdivision) for smoother deformation • Raise Noise Scale for larger waves • Animate Scene Time→Multiply feeding Noise W to get liquid motion</text>
