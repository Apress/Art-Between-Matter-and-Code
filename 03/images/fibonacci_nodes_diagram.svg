<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1000px" version="1.1" width="1600px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#faf9f7" height="1000" width="1600" x="0" y="0" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="26px" font-weight="bold" x="40" y="50">Geometry Nodes — Fibonacci / Golden-Angle Spiral (Typographic Diagram)</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" x="40" y="84">From mathematical rule to node structure: points placed by golden-angle (≈137.507764°) with radius scaled by φ = 1.618…</text><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="120" y2="120" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="200" y2="200" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="280" y2="280" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="360" y2="360" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="440" y2="440" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="520" y2="520" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="600" y2="600" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="680" y2="680" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="760" y2="760" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="840" y2="840" /><line stroke="#e5e7eb" stroke-width="1" x1="40" x2="1560" y1="920" y2="920" /><g><rect fill="#eef2ff" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="40" y="140" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="56" y="166">Group Input</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="56" y="188">N (count)</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="56" y="206">r₀ (start radius)</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="56" y="224">scale (growth)</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="56" y="242">seed (noise)</text></g><g><rect fill="#ecfeff" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="330" y="140" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="346" y="166">Mesh Line</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="346" y="188">Count = N</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="346" y="206">Start = 0, End = 1</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="346" y="224">Mode = Count</text></g><g><rect fill="#f0fdf4" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="620" y="140" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="636" y="166">Index</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="636" y="188">Outputs: i = 0…N-1</text></g><g><rect fill="#fff7ed" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="910" y="140" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="926" y="166">Math (Angle)</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="926" y="188">θ = i × 137.507764°</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="926" y="206">→ radians for trig</text></g><g><rect fill="#fff7ed" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="1200" y="140" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="1216" y="166">Math (Radius)</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="1216" y="188">φ = 1.618…</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="1216" y="206">r = r₀ × φ^( i / scale )</text></g><g><rect fill="#ffffff" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="330" y="262" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="346" y="288">Combine XYZ</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="346" y="310">X = cos(θ) × r</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="346" y="328">Y = sin(θ) × r</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="346" y="346">Z = 0</text></g><g><rect fill="#ffffff" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="620" y="262" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="636" y="288">Set Position</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="636" y="310">Geometry: Points</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="636" y="328">Position: XYZ from above</text></g><g><rect fill="#ffffff" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="910" y="262" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="926" y="288">Instance on Points</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="926" y="310">Instance: mesh segment / sphere</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="926" y="328">Pick Instance: optional</text></g><g><rect fill="#ffffff" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="1200" y="262" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="1216" y="288">Noise Variation (opt.)</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="1216" y="310">Noise → scale / rotation</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="1216" y="328">Subtle randomness for organic look</text></g><g><rect fill="#ffffff" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="910" y="384" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="926" y="410">Realize Instances</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="926" y="432">(for solid geometry / export)</text></g><g><rect fill="#fee2e2" height="72" rx="12" ry="12" stroke="#111827" stroke-width="2" width="230" x="1200" y="384" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="16px" font-weight="bold" x="1216" y="410">Group Output</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="14px" x="1216" y="432">Spiral points / instances</text></g><line stroke="#8b5cf6" stroke-width="3" x1="270" x2="330" y1="176.0" y2="176.0" /><polygon fill="#8b5cf6" points="330,176.0 318.0,182.0 318.0,170.0" /><line stroke="#8b5cf6" stroke-width="3" x1="560" x2="620" y1="176.0" y2="176.0" /><polygon fill="#8b5cf6" points="620,176.0 608.0,182.0 608.0,170.0" /><line stroke="#22c55e" stroke-width="3" x1="850" x2="910" y1="176.0" y2="176.0" /><polygon fill="#22c55e" points="910,176.0 898.0,182.0 898.0,170.0" /><line stroke="#22c55e" stroke-width="3" x1="1140" x2="1200" y1="176.0" y2="176.0" /><polygon fill="#22c55e" points="1200,176.0 1188.0,182.0 1188.0,170.0" /><line stroke="#111827" stroke-width="3" x1="1430" x2="880.0" y1="176.0" y2="176.0" /><polygon fill="#111827" points="880.0,176.0 892.0,170.0 892.0,182.0" /><line stroke="#111827" stroke-width="3" x1="880.0" x2="880.0" y1="176.0" y2="298.0" /><polygon fill="#111827" points="880.0,298.0 874.0,286.0 886.0,286.0" /><line stroke="#111827" stroke-width="3" x1="880.0" x2="330" y1="298.0" y2="298.0" /><polygon fill="#111827" points="330,298.0 342.0,292.0 342.0,304.0" /><line stroke="#111827" stroke-width="3" x1="1140" x2="695.0" y1="176.0" y2="176.0" /><polygon fill="#111827" points="695.0,176.0 707.0,170.0 707.0,182.0" /><line stroke="#111827" stroke-width="3" x1="695.0" x2="695.0" y1="176.0" y2="286" /><polygon fill="#111827" points="695.0,286 689.0,274.0 701.0,274.0" /><line stroke="#111827" stroke-width="3" x1="695.0" x2="330" y1="286" y2="286" /><polygon fill="#111827" points="330,286 342.0,280.0 342.0,292.0" /><line stroke="#111827" stroke-width="3" x1="560" x2="620" y1="298.0" y2="298.0" /><polygon fill="#111827" points="620,298.0 608.0,304.0 608.0,292.0" /><line stroke="#111827" stroke-width="3" x1="850" x2="910" y1="298.0" y2="298.0" /><polygon fill="#111827" points="910,298.0 898.0,304.0 898.0,292.0" /><line stroke="#111827" stroke-width="3" x1="1140" x2="1200" y1="298.0" y2="298.0" /><polygon fill="#111827" points="1200,298.0 1188.0,304.0 1188.0,292.0" /><line stroke="#f59e0b" stroke-width="3" x1="1430" x2="910" y1="298.0" y2="420.0" /><polygon fill="#f59e0b" points="910,420.0 920.3122925252319,411.4176563297635 923.0532504513283,423.10042781804356" /><line stroke="#f59e0b" stroke-width="3" x1="1140" x2="1200" y1="420.0" y2="420.0" /><polygon fill="#f59e0b" points="1200,420.0 1188.0,426.0 1188.0,414.0" /><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="18px" font-weight="bold" x="40" y="780">Notes</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="15px" x="40" y="808">• Golden angle placement (≈ 137.507764°) spreads points evenly (phyllotaxis: sunflower, pinecones).</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="15px" x="40" y="836">• Radius grows by the golden ratio φ to approximate a logarithmic spiral.</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="15px" x="40" y="864">• Swap ‘Instance on Points’ with ‘Curve from Points + Set Curve Radius’ for a continuous spiral curve.</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="15px" x="40" y="892">• Animate: keyframe N or scale to reveal growth over time.</text><text fill="#1f2937" font-family="Inter, Helvetica, Arial" font-size="15px" x="40" y="920">• Optional: jitter with Noise for natural irregularities.</text><text fill="#6b7280" font-family="Inter, Helvetica, Arial" font-size="14px" x="40" y="976">Diagram: Fibonacci / Golden-Angle Spiral — Blender Geometry Nodes (clean typographic style)</text></svg>