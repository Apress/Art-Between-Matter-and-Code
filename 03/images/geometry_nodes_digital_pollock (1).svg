    <rect x="40" y="730" rx="12" ry="12" width="740" height="120" fill="#ffffff" stroke="#e0e4ff" stroke-width="2"/>
    <text x="60" y="760" style="font-size:18px;font-weight:bold;fill:#1b1f33;font-family:DejaVu Sans, Arial;">Legend / Notes</text>
    <text x="60" y="785" style="font-size:14px;font-weight:normal;fill:#1e1e1e;font-family:DejaVu Sans, Arial;">• Input a gesture as a Curve (or Grease Pencil &gt; Convert to Curve).</text>
    <text x="60" y="805" style="font-size:14px;font-weight:normal;fill:#1e1e1e;font-family:DejaVu Sans, Arial;">• Optional jitter (Noise) adds organic irregularity to point positions.</text>
    <text x="60" y="825" style="font-size:14px;font-weight:normal;fill:#1e1e1e;font-family:DejaVu Sans, Arial;">• Two branches: (A) instanced drops (spheres), (B) instanced streaks (curve lines → mesh).</text>
    <text x="60" y="845" style="font-size:14px;font-weight:normal;fill:#1e1e1e;font-family:DejaVu Sans, Arial;">• Materials A/B can be colored/animated per layer; animate Noise W for evolving 'drip'.</text>
