<?xml version="1.0" ?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <rect x="0" y="0" width="1400" height="850" fill="#ffffff"/>
  <text x="700.0" y="36.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" text-anchor="middle" fill="#111111">Modeling Paradigms in Contemporary Practice</text>
  <text x="700.0" y="62.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#444444">From Manual to Digital, Procedural, and AI‑mediated / Data‑driven</text>
  <rect x="40.0" y="100" width="310.0" height="690" rx="18" ry="18" fill="#f8f9fb" stroke="#e3e6eb"/>
  <g>
    <g transform="translate(66.0,118) scale(1.2)" fill="none" stroke="#111111" stroke-width="2">
      <path d="M10,24 C10,14 18,10 24,10 C30,10 38,14 38,24 C38,34 30,40 24,40 C18,40 10,34 10,24 Z"/>
      <line x1="22" y1="10" x2="22" y2="4"/>
      <line x1="26" y1="10" x2="26" y2="2"/>
      <line x1="30" y1="11" x2="30" y2="5"/>
    </g>
  </g>
  <text x="120.0" y="140" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" fill="#111111">Manual Modeling</text>
  <circle cx="64.0" cy="174" r="3" fill="#333333"/>
  <text x="76.0" y="180" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="76.0" dy="0">Direct, tactile manipulation (clay, plaster, wax).</tspan>
  </text>
  <circle cx="64.0" cy="230" r="3" fill="#333333"/>
  <text x="76.0" y="236" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="76.0" dy="0">Gesture-driven authorship; irreversible marks.</tspan>
  </text>
  <circle cx="64.0" cy="286" r="3" fill="#333333"/>
  <text x="76.0" y="292" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="76.0" dy="0">Local operations; time-intensive refinement.</tspan>
  </text>
  <rect x="370.0" y="100" width="310.0" height="690" rx="18" ry="18" fill="#f8f9fb" stroke="#e3e6eb"/>
  <g>
    <g transform="translate(396.0,118) scale(1.2)" fill="none" stroke="#111111" stroke-width="2">
      <polygon points="4,4 28,20 18,22 16,32" fill="#111111" stroke="none"/>
      <path d="M32,8 L44,20 L38,26 L26,14 Z"/>
    </g>
  </g>
  <text x="450.0" y="140" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" fill="#111111">Digital Modeling</text>
  <circle cx="394.0" cy="174" r="3" fill="#333333"/>
  <text x="406.0" y="180" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="406.0" dy="0">Polygonal/NURBS sculpting in virtual space.</tspan>
  </text>
  <circle cx="394.0" cy="230" r="3" fill="#333333"/>
  <text x="406.0" y="236" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="406.0" dy="0">Non‑destructive tools (modifiers, symmetry).</tspan>
  </text>
  <circle cx="394.0" cy="286" r="3" fill="#333333"/>
  <text x="406.0" y="292" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="406.0" dy="0">Exportable to render, print, or VR contexts.</tspan>
  </text>
  <rect x="700.0" y="100" width="310.0" height="690" rx="18" ry="18" fill="#f8f9fb" stroke="#e3e6eb"/>
  <g>
    <g transform="translate(726.0,118) scale(1.2)" fill="none" stroke="#111111" stroke-width="2">
      <circle cx="14" cy="14" r="6"/>
      <circle cx="38" cy="14" r="6"/>
      <circle cx="26" cy="34" r="6"/>
      <line x1="20" y1="14" x2="32" y2="14"/>
      <line x1="18" y1="18" x2="24" y2="28"/>
      <line x1="34" y1="18" x2="28" y2="28"/>
    </g>
  </g>
  <text x="780.0" y="140" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" fill="#111111">Procedural Modeling</text>
  <circle cx="724.0" cy="174" r="3" fill="#333333"/>
  <text x="736.0" y="180" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="736.0" dy="0">Rule‑based systems (Geometry Nodes, Grasshopper).</tspan>
  </text>
  <circle cx="724.0" cy="230" r="3" fill="#333333"/>
  <text x="736.0" y="236" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="736.0" dy="0">Parameters propagate; global edits in real time.</tspan>
  </text>
  <circle cx="724.0" cy="286" r="3" fill="#333333"/>
  <text x="736.0" y="292" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="736.0" dy="0">Emulates growth, erosion, tilings; infinite variants.</tspan>
  </text>
  <rect x="1030.0" y="100" width="310.0" height="690" rx="18" ry="18" fill="#f8f9fb" stroke="#e3e6eb"/>
  <g>
    <g transform="translate(1056.0,118) scale(1.2)" fill="none" stroke="#111111" stroke-width="2">
      <circle cx="10" cy="12" r="3"/>
      <circle cx="10" cy="28" r="3"/>
      <circle cx="10" cy="44" r="3"/>
      <circle cx="42" cy="22" r="3"/>
      <circle cx="42" cy="38" r="3"/>
      <circle cx="26" cy="16" r="3"/>
      <circle cx="26" cy="32" r="3"/>
      <line x1="10" y1="12" x2="26" y2="16"/>
      <line x1="10" y1="28" x2="26" y2="16"/>
      <line x1="10" y1="44" x2="26" y2="16"/>
      <line x1="10" y1="12" x2="26" y2="32"/>
      <line x1="10" y1="28" x2="26" y2="32"/>
      <line x1="10" y1="44" x2="26" y2="32"/>
      <line x1="26" y1="16" x2="42" y2="22"/>
      <line x1="26" y1="16" x2="42" y2="38"/>
      <line x1="26" y1="32" x2="42" y2="22"/>
      <line x1="26" y1="32" x2="42" y2="38"/>
    </g>
  </g>
  <text x="1110.0" y="140" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" fill="#111111">AI‑mediated / Data‑driven</text>
  <circle cx="1054.0" cy="174" r="3" fill="#333333"/>
  <text x="1066.0" y="180" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="1066.0" dy="0">Learning systems propose unforeseen variations.</tspan>
  </text>
  <circle cx="1054.0" cy="230" r="3" fill="#333333"/>
  <text x="1066.0" y="236" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="1066.0" dy="0">Data, prompts, or sensors steer generation.</tspan>
  </text>
  <circle cx="1054.0" cy="286" r="3" fill="#333333"/>
  <text x="1066.0" y="292" font-family="Inter, Arial, Helvetica, sans-serif" font-size="14" fill="#333333">
    <tspan x="1066.0" dy="0">Authorship shifts toward curating systems &amp; datasets.</tspan>
  </text>
  <text x="40" y="830.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="12" fill="#666666">Editable SVG • Minimal vector icons • Suggested typeface: Inter (fallback: Arial/Helvetica)</text>
</svg>
