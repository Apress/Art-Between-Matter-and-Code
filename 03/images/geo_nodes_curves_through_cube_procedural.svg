<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900" version="1.1" width="1400" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#333" /></marker></defs><rect fill="#ffffff" height="900" width="1400" x="0" y="0" /><text fill="#111" font-family="Inter,Arial" font-size="20px" font-weight="bold" x="40" y="40">Geometry Nodes – Curves Passing Through a Cube (Variant 2: Fully Procedural)</text><text fill="#555" font-family="Inter,Arial" font-size="12px" x="40" y="66">Generates multiple curves whose start/end points are sampled around the cube's bounding box; curves are subdivided,</text><text fill="#555" font-family="Inter,Arial" font-size="12px" x="40" y="82">then offset by animated 4D noise; converted to tubes via Curve to Mesh.</text><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="40" y="140" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="40" y="140" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="50" y="158">Object Info (Cube)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="50" y="182">As Instance: OFF</text></g><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="320" y="140" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="320" y="140" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="330" y="158">Bounding Box</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="330" y="182">Outputs: Min, Max</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="300" x2="320" y1="168.0" y2="168.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="600" y="140" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="600" y="140" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="610" y="158">Vector Math (Subtract)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="610" y="182">Size = Max - Min</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="580" x2="600" y1="168.0" y2="168.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="880" y="140" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="880" y="140" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="890" y="158">Combine XYZ (Margin)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="890" y="182">0.25, 0.25, 0.25</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="860" x2="880" y1="168.0" y2="168.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="1160" y="140" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="1160" y="140" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="1170" y="158">Vector Math (Add)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="1170" y="182">MaxExt = Max + Margin</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="580" x2="1160" y1="168.0" y2="168.0" /><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1140" x2="1160" y1="168.0" y2="168.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="1160" y="380" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="1160" y="380" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="1170" y="398">Vector Math (Subtract)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="1170" y="422">MinExt = Min - Margin</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="580" x2="1160" y1="168.0" y2="408.0" /><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1140" x2="1160" y1="168.0" y2="408.0" /><g><rect fill="#f6f7fb" height="72" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="40" y="380" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="40" y="380" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="50" y="398">Mesh Line</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="50" y="422">Mode: Count</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="50" y="438">Count: 8–12 (curves)</text></g><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="320" y="380" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="320" y="380" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="330" y="398">Index</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="330" y="422">0..N-1</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="300" x2="320" y1="416.0" y2="408.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="600" y="380" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="600" y="380" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="610" y="398">Math (Add)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="610" y="422">Seed2 = Index + 100</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="580" x2="600" y1="408.0" y2="408.0" /><g><rect fill="#f6f7fb" height="72" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="880" y="380" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="880" y="380" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="890" y="398">Random Value (Vector)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="890" y="422">Start: MinExt → MaxExt</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="890" y="438">Seed: Index</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1420" x2="880" y1="408.0" y2="416.0" /><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1420" x2="880" y1="168.0" y2="416.0" /><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="580" x2="880" y1="408.0" y2="416.0" /><g><rect fill="#f6f7fb" height="72" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="1160" y="380" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="1160" y="380" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="1170" y="398">Random Value (Vector)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="1170" y="422">End: MinExt → MaxExt</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="1170" y="438">Seed: Seed2</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1420" x2="1160" y1="408.0" y2="416.0" /><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1420" x2="1160" y1="168.0" y2="416.0" /><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="860" x2="1160" y1="408.0" y2="416.0" /><g><rect fill="#f6f7fb" height="72" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="40" y="620" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="40" y="620" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="50" y="638">Curve Line</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="50" y="662">Start ← RV Start</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="50" y="678">End ← RV End</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1140" x2="40" y1="416.0" y2="656.0" /><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1420" x2="40" y1="416.0" y2="656.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="320" y="620" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="320" y="620" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="330" y="638">Subdivide Curve</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="330" y="662">Cuts: 24–32</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="300" x2="320" y1="656.0" y2="648.0" /><g><rect fill="#f6f7fb" height="104" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="600" y="620" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="600" y="620" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="610" y="638">Noise Texture (4D)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="610" y="662">Scale: 0.8</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="610" y="678">Detail: 2.0</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="610" y="694">Roughness: 0.5</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="610" y="710">W ← Scene Time (Seconds)</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="580" x2="600" y1="648.0" y2="672.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="880" y="620" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="880" y="620" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="890" y="638">Map Range</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="890" y="662">From 0–1 → To -0.05–0.05</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="860" x2="880" y1="672.0" y2="648.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="1160" y="620" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="1160" y="620" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="1170" y="638">Set Position</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="1170" y="662">Offset ← Map Range (Result)</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1140" x2="1160" y1="648.0" y2="648.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="600" y="800" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="600" y="800" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="610" y="818">Curve Circle (Profile)</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="610" y="842">Radius: 0.02–0.04</text></g><g><rect fill="#f6f7fb" height="72" rx="10" ry="10" stroke="#333" stroke-width="1" width="260" x="880" y="800" /><rect fill="#e3e6f5" height="26" rx="10" ry="10" stroke="none" width="260" x="880" y="800" /><text fill="#111" font-family="Inter,Arial" font-size="13px" font-weight="bold" x="890" y="818">Curve to Mesh</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="890" y="842">Curve ← Set Position</text><text fill="#333" font-family="Inter,Arial" font-size="12px" x="890" y="858">Profile ← Curve Circle</text></g><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="1420" x2="880" y1="648.0" y2="836.0" /><line marker-end="url(#arrow)" stroke="#333" stroke-width="1.5" x1="860" x2="880" y1="828.0" y2="836.0" /><g><rect fill="#f6f7fb" height="56" rx="10" ry="10" stroke="#333" stroke-width="1" 