       class="small"
       id="text27">• Identity imagination function as materials shaped by human input and algorithmic re-elaboration.</text>
    <text
       x="75"
       y="597"
       class="small"
       id="text28">• Portraits manifest as deformed/partial/hybrid visages—between presence and abstraction, memory and invention.</text>
    <text
