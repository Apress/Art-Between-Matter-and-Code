<svg baseProfile="tiny" height="800px" version="1.2" width="1000px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#f0f0f0" height="120" stroke="black" stroke-width="1" width="380" x="50" y="50" /><text font-family="Arial" font-size="14px" x="60" y="70">1. Modeling from Scratch</text><text font-family="Arial" font-size="14px" x="60" y="95">Input: Idea, sketch, reference image</text><text font-family="Arial" font-size="14px" x="60" y="113">Software: Blender, ZBrush, Maya</text><text font-family="Arial" font-size="14px" x="60" y="131">Techniques: Polygonal modeling, sculpting, procedural modeling</text><text font-family="Arial" font-size="14px" x="60" y="149">Output: 3D mesh for rendering or printing</text><rect fill="#f0f0f0" height="120" stroke="black" stroke-width="1" width="380" x="50" y="200" /><text font-family="Arial" font-size="14px" x="60" y="220">2. 3D Acquisition</text><text font-family="Arial" font-size="14px" x="60" y="245">Input: Physical object</text><text font-family="Arial" font-size="14px" x="60" y="263">Technologies: Photogrammetry, structured light, LIDAR</text><text font-family="Arial" font-size="14px" x="60" y="281">Software: Meshroom, RealityCapture</text><text font-family="Arial" font-size="14px" x="60" y="299">Output: High-res 3D mesh, requires optimization</text><rect fill="#f0f0f0" height="120" stroke="black" stroke-width="1" width="380" x="50" y="350" /><text font-family="Arial" font-size="14px" x="60" y="370">3. Post-Processing</text><text font-family="Arial" font-size="14px" x="60" y="395">Mesh cleaning, retopology, UV mapping, rigging</text><text font-family="Arial" font-size="14px" x="60" y="413">Bridges model and use in AR/VR, fabrication</text><rect fill="#f0f0f0" height="120" stroke="black" stroke-width="1" width="380" x="50" y="500" /><text font-family="Arial" font-size="14px" x="60" y="520">4. Digital to Physical</text><text font-family="Arial" font-size="14px" x="60" y="545">3D Printing, CNC Milling, Casting</text><text font-family="Arial" font-size="14px" x="60" y="563">Used to materialize digital forms</text></svg>